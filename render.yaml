services:
  - type: web
    name: resumefit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SITE_ACCESS_CODE
        sync: false
      - key: REQUESTS_PER_MINUTE
        value: "5"
      - key: DAILY_GENERATION_LIMIT
        value: "100"
      - key: TRUST_PROXY
        value: "1"
